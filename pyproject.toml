dependencies = [
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-filter>=26.1",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "ipython>=9.15.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "python-decouple>=3.8",
    "ruff>=0.15.22",
    "validate-docbr>=2.0.0",
